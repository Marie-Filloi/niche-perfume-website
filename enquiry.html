<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niche Perfumes - Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Niche Perfumes</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="enquiry-form" style="background-image: url('images/enquiry/enquiry-bg.jpg'); background-size: cover; background-position: center; padding: 40px;">
            <h2>Get in Touch</h2>
            <p>Have a question about a fragrance, or want a personalised recommendation? Send us an enquiry and we'll get back to you.</p>

            <form action="#" method="post">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number (optional)</label>
                <input type="tel" id="phone" name="phone">

                <label for="enquiry-type">Enquiry Type</label>
                <select id="enquiry-type" name="enquiry-type">
                    <option value="product">Product Question</option>
                    <option value="stockist">Stockist Enquiry</option>
                    <option value="other">Other</option>
                </select>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send Enquiry</button>
            </form>

            <p class="note">We aim to respond within 1–2 business days.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Niche Perfumes. All rights reserved.</p>
    </footer>

</body>
</html>
